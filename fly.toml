# Fly.io deploy — the Render backstop. `fly launch --no-deploy` then `fly deploy`.
app = "qwintiq-vault"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  VAULT_ENV = "prod"          # turns on the fail-closed prod guards (no default admin/secret/DB)
  VAULT_SEMANTIC_GUARD = "1"  # catch fluent-paraphrase leaks via a cheap model second-pass
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true          # TLS at the edge; forwards x-forwarded-proto=https
  auto_stop_machines = false  # keep it up: in-memory MCP session + rate-limiter state
  auto_start_machines = true
  min_machines_running = 1    # single instance (scale-out needs shared session state first)

# Secrets are NOT in this file. Set them once, out of band:
#   fly secrets set DATABASE_URL=... ANTHROPIC_API_KEY=... AI_ARK_API_KEY=... \
#                   SECRET_KEY=$(openssl rand -hex 32) \
#                   ADMIN_EMAIL=... ADMIN_PASSWORD=...
# (DATABASE_URL: a Fly Postgres attach, or any external Postgres. No DB = refuses to boot.)
